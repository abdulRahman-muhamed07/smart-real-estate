<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيع عقارك | العقار الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global.css">
</head>

<body class="bg-gray-50 text-slate-900">

    <!-- Universal Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-[100]">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-12">
                <a href="index.html" class="text-2xl font-black text-blue-700 flex items-center gap-2 cursor-pointer">
                    <span class="bg-blue-600 text-white p-1 rounded-lg">🏠</span> العقار الذكي
                </a>
                <ul class="hidden lg:flex gap-8 text-slate-600 font-bold text-sm">
                    <li><a href="index.html" class="hover:text-blue-600 cursor-pointer transition">الرئيسية</a></li>
                    <li><a href="home.html" class="hover:text-blue-600 cursor-pointer transition">شراء</a></li>
                    <li class="px-4 py-1.5 bg-blue-700 text-white rounded-full cursor-pointer transition">بيع</li>
                    <li class="hover:text-blue-600 cursor-pointer transition">إيجار</li>
                    <li class="text-blue-600 flex items-center gap-1 cursor-pointer font-black">بحث AI <span
                            class="text-[10px] bg-blue-100 px-1 rounded">PRO</span></li>
                    <li class="hover:text-blue-600 cursor-pointer transition">من نحن</li>
                </ul>
            </div>
            <div class="flex items-center gap-4">
                <a href="login.html" class="px-5 py-2 text-slate-700 font-bold hover:text-blue-600 transition">تسجيل
                    دخول</a>
                <button
                    class="px-6 py-2.5 bg-blue-700 text-white rounded-xl font-bold hover:bg-blue-800 shadow-lg shadow-blue-100 transition">ابدأ
                    الآن</button>
            </div>
        </nav>
    </header>

    <main class="py-20 animate-section">
        <div class="container mx-auto px-6 max-w-4xl">
            <div class="text-center mb-12">
                <h1 class="text-4xl font-black mb-4">قم ببيع عقارك بكل سهولة</h1>
                <p class="text-slate-500 font-bold">أدخل تفاصيل عقارك وسنقوم بعرضه لآلاف المشترين المهتمين</p>
            </div>

            <div class="bg-white p-10 lg:p-16 rounded-[2.5rem] shadow-xl border border-slate-100">
                <form class="space-y-8 text-right font-bold">
                    <div class="grid md:grid-cols-2 gap-8">
                        <div>
                            <label class="block text-sm text-slate-700 mb-3 mr-2">نوع العقار</label>
                            <select
                                class="w-full p-4.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50">
                                <option>شقة سكنية</option>
                                <option>فيلا مستقلة</option>
                                <option>شاليه</option>
                                <option>محل تجاري</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-700 mb-3 mr-2">المساحة (متر مربع)</label>
                            <input type="number" placeholder="مثال: 150"
                                class="w-full p-4.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 text-right">
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-8">
                        <div>
                            <label class="block text-sm text-slate-700 mb-3 mr-2">عدد الغرف</label>
                            <input type="number" placeholder="3"
                                class="w-full p-4.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 text-right">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-700 mb-3 mr-2">السعر المتوقع (ج.م)</label>
                            <input type="number" placeholder="1,500,000"
                                class="w-full p-4.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 text-right">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm text-slate-700 mb-3 mr-2">رقم التواصل</label>
                        <input type="text" placeholder="01XXXXXXXXX"
                            class="w-full p-4.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 text-right">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-700 mb-3 mr-2">وصف العقار</label>
                        <textarea rows="5" placeholder="اكتب تفاصيل إضافية عن العقار..."
                            class="w-full p-4.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 text-right"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-black py-5 rounded-2xl mt-4 shadow-xl shadow-blue-100 transition-all text-xl">
                        عرض العقار للبيع
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-slate-950 text-white pt-24 pb-12 mt-24">
        <div class="container mx-auto px-6 text-center text-slate-500 font-bold text-sm">
            © 2025 العقار الذكي. All rights reserved.
        </div>
    </footer>

    <script src="assets/js/scripts.js"></script>
</body>

</html>
