<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | العقار الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <style>.bg-auth { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1484154218962-a197022b5858?auto=format&fit=crop&w=1900'); background-size: cover; background-position: center; }</style>
</head>
<body class="min-h-screen bg-auth flex items-center justify-center p-4 relative">
    <a href="index.html" class="absolute top-10 right-10 text-white font-black flex items-center gap-2 bg-black/30 px-6 py-3 rounded-2xl backdrop-blur-md hover:bg-black/50 transition">🏠 العودة للرئيسية</a>
    <div class="glass-card p-12 lg:p-16 rounded-[3.5rem] shadow-2xl w-full max-w-lg text-center animate-section bg-white/95 backdrop-blur-xl">
        <h2 class="text-3xl font-black mb-10 text-slate-800">تسجيل الدخول</h2>
        <form id="loginForm" class="space-y-6">
            <div class="text-right">
                <label class="block text-xs text-slate-500 mb-1.5 mr-2 uppercase tracking-wide font-black">البريد الإلكتروني</label>
                <input id="loginEmail" type="email" placeholder="example@mail.com" class="w-full p-4.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none transition text-right font-bold bg-white" required>
            </div>
            <div class="text-right">
                <label class="block text-xs text-slate-500 mb-1.5 mr-2 uppercase tracking-wide font-black">كلمة المرور</label>
                <input id="loginPassword" type="password" placeholder="••••••••" class="w-full p-4.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-600 outline-none transition text-right font-bold bg-white" required>
            </div>
            <div class="flex justify-between items-center text-sm font-bold px-1">
                <label class="flex items-center gap-2 cursor-pointer text-slate-600">
                    <input id="loginRemember" type="checkbox" class="w-4 h-4 rounded border-slate-300"> تذكرني لاحقاً
                </label>
                <a href="#" class="text-blue-600 hover:underline font-black">نسيت كلمة المرور؟</a>
            </div>
            <button id="loginBtn" type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-5 rounded-2xl font-black shadow-xl shadow-blue-100 transition-all text-lg mt-4">تسجيل الدخول</button>
            <p id="loginError" class="text-red-500 font-bold text-sm hidden"></p>
        </form>
        <p class="mt-10 text-slate-600 font-bold">لا يوجد لديك حساب؟ <a href="signup.html" class="text-blue-700 hover:underline font-black">انشاء حساب جديد</a></p>
    </div>
    <script src="assets/js/scripts.js"></script>
</body>
</html>
