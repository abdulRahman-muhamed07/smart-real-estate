<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انشاء حساب | العقار الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body class="min-h-screen bg-auth flex items-center justify-center py-16 px-4 relative">
    <a href="index.html"
        class="absolute top-10 right-10 text-white font-black flex items-center gap-2 bg-black/30 px-6 py-3 rounded-2xl backdrop-blur-md hover:bg-black/50 transition">
        🏠 العودة للرئيسية
    </a>
    <div class="glass-card p-12 lg:p-16 rounded-[3.5rem] shadow-2xl w-full max-w-xl text-center animate-section">
        <h2 class="text-3xl font-black mb-8 text-slate-800">انشاء حساب جديد</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5 text-right font-bold">
            <div>
                <label class="block text-xs text-slate-500 mb-1.5 mr-2 uppercase tracking-wide">الاسم الأول</label>
                <input type="text" placeholder="محمد"
                    class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1.5 mr-2 uppercase tracking-wide">اسم العائلة</label>
                <input type="text" placeholder="علي"
                    class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
        </div>
        <div class="space-y-5 text-right font-bold">
            <div>
                <label class="block text-xs text-slate-500 mb-1.5 mr-2 uppercase tracking-wide">البريد
                    الإليكتروني</label>
                <input type="email" placeholder="example@mail.com"
                    class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-700 outline-none">
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1.5 mr-2 uppercase tracking-wide">رقم الهاتف</label>
                <div class="flex flex-row-reverse group">
                    <span
                        class="p-4 border border-l-0 border-slate-200 bg-slate-50 rounded-r-2xl text-slate-500">+20</span>
                    <input type="text" placeholder="10XXXXXXXX"
                        class="w-full p-4 border border-slate-200 rounded-l-2xl focus:ring-2 focus:ring-blue-700 outline-none">
                </div>
            </div>
            <div class="grid md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs text-slate-500 mb-1.5 mr-2 uppercase tracking-wide">كلمة المرور</label>
                    <input type="password"
                        class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-700 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1.5 mr-2 uppercase tracking-wide">تأكيد كلمة
                        المرور</label>
                    <input type="password"
                        class="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-700 outline-none">
                </div>
            </div>
            <a href="home.html"
                class="block w-full bg-blue-700 hover:bg-blue-800 text-white py-5 rounded-2xl font-black shadow-lg shadow-blue-100 transition-all text-lg mt-4">
                انشاء حساب
            </a>
        </div>
        <p class="mt-10 text-slate-600 font-bold">
            لديك حساب بالفعل؟ <a href="login.html" class="text-blue-700 hover:underline font-black">تسجيل دخول</a>
        </p>
    </div>
    <script src="assets/js/scripts.js"></script>
</body>

</html>
